ld);font:11px Arial,sans-serif;letter-spacing:.16em;margin-bottom:12px}.case-code-display{background:#0b0a09;border:1px solid var(--gold);border-radius:8px;padding:18px 12px;text-align:center;color:var(--gold);font:700 24px/1.2 Arial,sans-serif;letter-spacing:.16em;margin:20px 0}.auth-actions{margin-top:16px}.create-account-hero{text-align:center;margin-bottom:24px}.create-kicker{font:10px Arial,sans-serif;letter-spacing:.22em;color:var(--gold);margin-bottom:10px}.create-account-hero .auth-title{margin-bottom:10px}.create-account-hero .auth-copy{max-width:520px;margin:0 auto}.create-actions{margin-top:24px}.create-account-btn{width:100%;border:1px solid #b95a55;border-radius:8px;background:linear-gradient(180deg,#ad4d49,#8f3e3b);color:#fff;padding:15px 18px;cursor:pointer;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.28)}.create-account-btn span{display:block;font:600 16px Arial,sans-serif;letter-spacing:.08em}.create-account-btn small{display:block;margin-top:5px;font:12px Georgia,serif;color:#ead8d2}.create-account-btn:hover{background:linear-gradient(180deg,#bb5752,#99423f);transform:translateY(-1px)}.return-note{text-align:center;margin-top:18px;font:12px Arial,sans-serif;color:var(--muted)}.text-link{border:0;background:none;color:var(--gold);padding:0;cursor:pointer;font:inherit;text-decoration:underline}.auth-tabs{display:none}</style>

<body><div class="wrap"><header><div class="kicker">Private Investigation Channel</div><div class="title">UNINVITED</div><div class="sub">CASE 0147 · Detective Theo Marsh</div></header><div id="app"></div></div>
<script>
const KEY="UNINVITED_V7_CONVERSATION";
const AUTH_KEY="UNINVITED_AUTH_V2";
const API_BASE="https://uninvited-six.vercel.app";
const LEADS=[
 {n:1,answer:"1058",prompt:"I went back through the CCTV report.\n\nMost of the reception was covered, but there was a gap in the camera coverage. The report places the blind spot around Tables 46 through 50.\n\nThat's important, but it doesn't tell us who was there.\n\nCheck that section of the wedding ledger for me.\n\nWhat count do you get?",ok:"1,058."},
 {n:2,answer:"162",prompt:"That's still too many people.\n\nI went back to the physical evidence.\n\nThere's a handwritten mark on one of the items recovered during the investigation. It's damaged, but I can make out what might be a first initial.\n\nT, H, J, or I.\n\nI'm not confident enough to say which one it is.\n\nSee what that does to the group.\n\nWhat count do you get?",ok:"162."},
 {n:3,answer:"52",prompt:"I also had the lab re-check something recovered from the reception.\n\nThey identified chicken gravy.\n\nIt may give us another way to narrow the same group.\n\nCheck the meal field.\n\nWhat count do you get?",ok:"52."},
 {n:4,answer:"22",prompt:"Check the remaining records for the bride's side.\n\nWhat count do you get?",ok:"22."},
 {n:5,answer:"11",prompt:"That's a much smaller group.\n\nI found another piece of the evidence that may help.\n\nAn unidentified wedding gift was recorded in the inventory. We never established who sent it, but the inventory gives us an approximate value.\n\nIt falls somewhere between $50 and $150.\n\nCheck that value range against the eleven remaining records.\n\nWhat count do you get?",ok:"11."},
 {n:6,answer:"2",prompt:"Eleven.\n\nI found another piece of the evidence that may help.\n\nAn unidentified wedding gift was recorded in the inventory. We never established who sent it, but the inventory gives us an approximate value.\n\nIt falls somewhere between $50 and $150.\n\nCheck that value range against the eleven remaining records.\n\nWhat count do you get?",ok:"2."},
 {n:7,answer:"49",prompt:"Only two people still fit everything we've found.\n\nI went back to the evidence recovered from the reception.\n\nThere's a torn seating marker. Most of it is missing, but one detail is still readable:\n\nTable 49.\n\nI don't have the seat number.\n\nCheck the two remaining records against Table 49.\n\nGive me the full name, table number, and seat number of the person who remains.",ok:"Seven pieces of evidence. One person left."}
];
const HINTS={1:["Count every record whose table number is 46, 47, 48, 49, or 50."],2:["Use the first initial of the guest’s first name. Keep T, H, J, and I."],3:["Use the MEAL field. Ck means Chicken."],4:["The pink guest badge points to the bride’s side. Use SIDE = Br."],5:["Use the RSVP status from Theo’s late-confirmation clue. Keep E or L."],6:["Use the GIFT bracket, not an exact price. $$ means $50–150."],7:["The torn marker gives only Table 49. Check the two remaining records and identify the person at that table."]};
const initial={tab:"theo",lead:0,profileStage:0,pendingAccusation:"",iris:false,messages:[],docs:[],facts:{},task:"",final:false,hints:{},hintAvailable:false,notice:{theo:false,legal:false}};
let S=load();
function normalizeState(input){
 var s;
 try{s=structuredClone(input||initial)}catch(e){s=structuredClone(initial)}
 s.docs=Array.isArray(s.docs)?s.docs.filter(function(d){return d&&["ella","owen","interrogation"].indexOf(d.id)>=0}):[];
 s.facts=s.facts||{};
 s.hints=s.hints&&typeof s.hints==="object"?s.hints:{};s.hintAvailable=!!s.hintAvailable;
 s.profileStage=Number.isFinite(Number(s.profileStage))?Number(s.profileStage):0;
 s.pendingAccusation=s.pendingAccusation||"";
 s.notice=s.notice&&typeof s.notice==="object"?s.notice:{theo:false,legal:false};
 if(s.tab==="status")s.tab="theo";
 var msgText=(s.messages||[]).map(function(m){return String(m&&m.t||"")}).join(" ").toLowerCase();
 if(s.profileStage===0&&msgText.indexOf("ella taylor")>=0){s.profileStage=1;s.pendingAccusation="Ella Taylor";}
 if(s.profileStage===2&&msgText.indexOf("owen hawthorne")>=0&&msgText.indexOf("send an accusation against owen")>=0){s.profileStage=3;s.pendingAccusation="Owen Hawthorne";}
 if((Number(s.lead)||0)>=7 || msgText.indexOf("iris smith. table 49")>=0){s.iris=true;s.facts=s.facts||{};s.facts.identified=true;s.profileStage=4;}
 var hadReport=s.docs.some(function(d){return d.id==="interrogation"});
 if(s.iris){s.profileStage=4;s.lead=Math.max(7,Number(s.lead)||0)}
 s.facts={identified:!!s.iris,interrogationSent:!!(s.facts.interrogationSent||hadReport)};
 if(s.final){
  s.task="CASE CLOSED";
 }else if(s.iris&&s.facts.interrogationSent){
  s.task="";
 }else if(s.iris){
  s.task="Email the Legal Team and request an interrogation of Iris.";
 }else if(s.profileStage===1){
  s.task="Send an accusation against Ella Taylor to the Legal Team.";
 }else if(s.profileStage===3){
  s.task="Send an accusation against Owen Hawthorne to the Legal Team.";
 }
 return s;
}
function load(){try{return normalizeState(JSON.parse(localStorage.getItem(KEY))||initial)}catch(e){return structuredClone(initial)}}
function save(){
 localStorage.setItem(KEY,JSON.stringify(S));
 var auth=getAuth();
 if(auth&&auth.token){clearTimeout(window.__saveTimer);window.__saveTimer=setTimeout(function(){api("/api/progress",{method:"PUT",body:JSON.stringify({progress:S})}).catch(function(){});},250);}
}
function esc(x){return String(x).replace(/[&<>\"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function add(w,t){S.messages.push({w:w,t:t});save()}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9$ ]/g," ").replace(/\s+/g," ").trim()}
function has(s,a){return a.some(function(x){return s.indexOf(x)>=0})}
function fact(k){return !!S.facts[k]}
function task(t){S.task=t;save()}
function opening(){return;}
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY))||null}catch(e){return null}}
function setAuth(a){localStorage.setItem(AUTH_KEY,JSON.stringify(a))}
function api(path,options){
 options=options||{}; options.headers=Object.assign({},options.headers||{});
 var auth=getAuth();
 if(path!=="/api/auth" && auth&&auth.token) options.headers.Authorization="Bearer "+auth.token;
 if(path==="/api/auth"){options.body=typeof options.body==="string"?options.body:JSON.stringify(options.body||{});options.headers["Content-Type"]="text/plain";}
 else {options.headers["Content-Type"]="application/json";}
 return fetch(API_BASE+path,options).then(async function(r){var d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||"Connection error.");return d;});
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));var auth=getAuth();if(auth&&auth.token){clearTimeout(window.__saveTimer);window.__saveTimer=setTimeout(function(){api("/api/progress",{method:"PUT",body:JSON.stringify({progress:S})}).catch(function(){});},250);}}
async function signInEmail(){var email=(document.getElementById("authEmail")||{}).value||"",password=(document.getElementById("authPassword")||{}).value||"";if(!email||!email.includes("@")||!password){authMessage("Enter your email and password.");return}try{var d=await api("/api/auth",{method:"POST",body:JSON.stringify({action:"login",email,password})});setAuth({token:d.token,player:d.player});S=normalizeState(d.progress||structuredClone(initial));localStorage.setItem(KEY,JSON.stringify(S));render();}catch(e){authMessage(e.message)}}
async function signInCode(){var code=((document.getElementById("authCaseCode")||{}).value||"").trim().toUpperCase();if(!code){authMessage("Enter your case code.");return}try{var d=await api("/api/auth",{method:"POST",body:JSON.stringify({action:"codeLogin",caseCode:code})});setAuth({token:d.token,player:d.player});S=normalizeState(d.progress||structuredClone(initial));localStorage.setItem(KEY,JSON.stringify(S));render();}catch(e){authMessage(e.message)}}
async function createAccount(){var name=(document.getElementById("authName")||{}).value||"",email=(document.getElementById("authEmail")||{}).value||"",password=(document.getElementById("authPassword")||{}).value||"";if(!name||!email.includes("@")||password.length<8){authMessage("Enter your name, a valid email, and a password of at least 8 characters.");return}try{var d=await api("/api/auth",{method:"POST",body:JSON.stringify({action:"create",name,email,password})});setAuth({token:d.token,player:d.player});S=normalizeState(structuredClone(initial));localStorage.setItem(KEY,JSON.stringify(S));showAssignedCode(d.player);}catch(e){authMessage(e.message)}}
function logout(){localStorage.removeItem(AUTH_KEY);localStorage.removeItem(KEY);S=structuredClone(initial);render()}
function authTab(t){window.AUTH_TAB=t;renderAuth()}
function authMessage(msg){var e=document.getElementById("authError");if(e){e.textContent=msg;e.style.display="block"}}
function showAssignedCode(player){
 var code=player&&player.caseCode?player.caseCode:"";
 document.getElementById("app").innerHTML='<div class="auth-shell"><div class="auth-card"><div class="auth-success">ACCOUNT CREATED</div><h2 class="auth-title">Your case has been assigned</h2><p class="auth-copy">Your UNINVITED investigation has been created. This unique case code belongs to you.</p><div class="case-code-display">'+esc(code)+'</div><p class="auth-copy"><strong>Save this code.</strong> You can use it to return to your investigation whenever you come back.</p><div class="auth-actions"><button class="btn primary" onclick="S=structuredClone(initial);render()">ENTER CASE ROOM</button></div></div></div>';
}
function renderAuth(){
 var t=window.AUTH_TAB||"create";
 var body=t==="signin"
 ? '<h2 class="auth-title">Return to your case</h2><p class="auth-copy">Choose how you want to return to your investigation.</p><div class="auth-form"><div class="login-option"><h3>Email & Password</h3><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"><label>Password</label><input id="authPassword" type="password" placeholder="Password"><div class="auth-actions"><button class="btn primary" onclick="signInEmail()">SIGN IN</button></div></div><div class="auth-divider">OR</div><div class="login-option"><h3>Case Code</h3><p class="small-copy">Use the unique code assigned to your investigation.</p><label>Case code</label><input id="authCaseCode" class="code-box" placeholder="UNV-XXXXXX-XXXX"><div class="auth-actions"><button class="btn" onclick="signInCode()">RETURN WITH CASE CODE</button></div></div></div>'
 : '<div class="create-account-hero"><div class="create-kicker">PRIVATE INVESTIGATION</div><h2 class="auth-title">Create Your Detective Account</h2><p class="auth-copy">Set up your private case room. After registration, UNINVITED will automatically assign your unique case code.</p></div><div class="auth-form"><label>NAME</label><input id="authName" placeholder="Your name"><label>EMAIL</label><input id="authEmail" type="email" placeholder="you@example.com"><label>PASSWORD</label><input id="authPassword" type="password" placeholder="At least 8 characters"><div class="create-actions"><button class="create-account-btn" onclick="createAccount()"><span>CREATE ACCOUNT</span><small>Get my case code</small></button></div></div>';
 document.getElementById("app").innerHTML='<div class="auth-shell"><div class="auth-card">'+body+'<div id="authError" class="auth-error"></div><div class="auth-note">Your case code is assigned automatically when you create your account. Keep it safe — you can use it to return to your case.</div>'+ (t==="signin" ? '<div class="return-note">New player? <button class="text-link" onclick="authTab(\'create\')">Create your account</button></div>' : '<div class="return-note">Already have an account? <button class="text-link" onclick="authTab(\'signin\')">Return to your case</button></div>') +'</div></div>';
}
function render(){
 if(!getAuth()){renderAuth();return}
 opening();
 var auth=getAuth();
 var account='<div class="account-bar">Case '+esc(auth.player.caseCode)+' · Signed in as '+esc(auth.player.name)+' <button class="btn" onclick="logout()">SIGN OUT</button></div>';
 var nav=account+'<div class="nav"><button class="tab '+(S.tab==="theo"?"active":"")+'" onclick="tab(\'theo\')">THEO MARSH'+(S.notice.theo?'<span class="notice-dot"></span>':"")+'</button><button class="tab '+(S.tab==="legal"?"active":"")+'" '+(!(S.iris||S.profileStage===1||S.profileStage===2||S.profileStage===3||S.docs.some(function(d){return d.id==="ella"||d.id==="owen"}))?"disabled":"")+' onclick="tab(\'legal\')">LEGAL TEAM '+((S.iris||S.profileStage>=1||S.docs.some(function(d){return d.id==="ella"||d.id==="owen"}))?"🔓":"🔒")+(S.notice.legal?'<span class="notice-dot"></span>':"")+'</button><button class="tab" onclick="resetCase()">START OVER</button></div>';
 document.getElementById("app").innerHTML=nav+(S.tab==="theo"?theo():S.tab==="legal"?legal():status())+'<div class="small" style="margin-top:12px">Private case channel · V8 investigation journey · your progress is saved to your case.</div>';
}
function journeyBar(){ return ""; }
function useHint(){
 if(window.__typing)return;
 if(S.final||S.iris||S.profileStage===1||S.profileStage===3||!S.hintAvailable)return;
 var n=S.lead+1;
 if(S.hints[n])return;
 S.hints[n]=true;
 S.hintAvailable=false;
 add("theo","Hint — "+HINTS[n][0]);
 save();
 playMessageSound();
 render();

function playMessageSound(){
 try{
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  window.__audio=window.__audio||new AC();var ctx=window.__audio;
  if(ctx.state==="suspended")ctx.resume();
  var now=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type="sine";osc.frequency.setValueAtTime(880,now);osc.frequency.exponentialRampToValueAtTime(1320,now+0.09);
  gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.07,now+0.01);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.16);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+0.18);
 }catch(e){}
}

 }
 if(S.profileStage===3){
  if(has(n,["email","legal team","accuse owen","owen hawthorne","owen"])){task("Send the accusation against Owen Hawthorne to the Legal Team.");save();return}
  add("theo","I want to test Owen Hawthorne next. Send the accusation to the Legal Team.");task("Send an accusation against Owen Hawthorne to the Legal Team.");return;
 }
 if(S.iris){
  if(has(n,["email","legal team","interrogate iris","interrogation","send the request","request the interview"])){
   task("Email the Legal Team and request an interrogation of Iris.");save();return;
  }

   add("theo","Iris Smith has been identified, but I want the Legal Team to interrogate her before we close the case.");task("Email the Legal Team and request an interrogation of Iris.");return;
  }

 }
 if(S.lead===3&&S.profileStage===0){

 }

function leadRoute(n){

 if(!L)return;
 if(n===L.answer||(L.n===7&&has(n,["iris smith","iris","49"]))){

   S.profileStage=1;
   S.notice.legal=true;
   task("Send an accusation against Ella Taylor to the Legal Team.");
  }else if(L.n===4&&S.profileStage===2){
   add("theo",L.ok);
   add("theo","Twenty-two.\n\nThere's another name I want to test against the original profile.\n\nOwen Hawthorne fits the four characteristics:\n\nFirst name I–Q.\nBride's side.\nOdd-numbered table.\nConfirmed after the RSVP deadline.\n\nHis account of the evening also leaves a gap.\n\nSend an accusation against Owen Hawthorne to the Legal Team.");
   S.profileStage=3;

  }else{
   S.iris=true;S.facts.identified=true;
   S.notice.legal=true;
   add("theo","Iris Smith. Table 49, Seat 8.\n\nThat's the identification I needed.\n\nShe doesn't fit the guest profile cleanly. She wasn't an ordinary guest — she was part of the wedding management team, so the late-confirmation criterion doesn't apply to her.\n\nThat doesn't clear her. It means the original profile was built around the guests, not everyone who had access to the cellar.\n\nNow I want answers about what happened between Iris and Margery.\n\nEmail Jasmine's Legal Team and ask them to interrogate Iris. Find out what happened.");
   task("Email the Legal Team and request an interrogation of Iris.");
  }
  save();
 }else {
  S.hintAvailable=true;

  save();

}
