<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNINVITED — Private Case Room</title>
<style>
:root{--bg:#11100f;--panel:#1b1917;--panel2:#211e1b;--text:#eee8df;--muted:#a9a097;--line:#3b342e;--accent:#a84b48;--gold:#c8a66a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Georgia,serif}.wrap{max-width:980px;margin:auto;padding:24px 18px 60px}header{border-bottom:1px solid var(--line);padding:10px 0 20px;margin-bottom:18px}.kicker{font:11px Arial,sans-serif;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}.title{font-size:32px;letter-spacing:.12em;margin:5px 0}.sub{color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer}.tab.active,.btn.primary{background:var(--accent);border-color:var(--accent)}.tab:disabled{opacity:.4;cursor:not-allowed}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}.chat{max-height:58vh;overflow:auto;padding:4px}.msg{margin:12px 0;display:flex}.msg.theo{justify-content:flex-start}.msg.player{justify-content:flex-end}.bubble{max-width:82%;padding:12px 15px;border-radius:12px;white-space:pre-wrap}.theo .bubble{background:var(--panel2);border:1px solid var(--line)}.player .bubble{background:#382525;border:1px solid #65403e}.speaker{font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1;background:#0e0d0c;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:8px;font:15px Georgia,serif}.composer button{min-width:100px}.task{border-left:3px solid var(--gold);padding:10px 14px;background:#171513;margin:14px 0}.task strong{display:block;color:var(--gold);font:11px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}.statusrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statusbox{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:8px}.statusbox b{display:block;color:var(--gold);font:11px Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}.statusbox span{color:var(--muted)}.small{font:12px Arial,sans-serif;color:var(--muted)}.locked{color:var(--muted);font-style:italic}.doc{background:#eee7da;color:#211c18;padding:20px;border-radius:8px}.doc h3{margin-top:0}@media(max-width:650px){.bubble{max-width:92%}.statusrow{grid-template-columns:1fr}.composer{flex-direction:column}.composer button{width:100%}}
</style>
</head>
<body><div class="wrap"><header><div class="kicker">Private Investigation Channel</div><div class="title">UNINVITED</div><div class="sub">CASE 0147 · Detective Theo Marsh</div></header><div id="app"></div></div>
<script>
const KEY="UNINVITED_V4_MASTER_CONVERSATION";
const LEADS=[
{n:1,answer:"1058",prompt:"The CCTV report has a blind spot around the cellar. The relevant seating section is Tables 46 through 50. Test that against the ledger. Give me the count.",ok:"Correct. 1,058 records remain. Let's keep going."},
{n:2,answer:"162",prompt:"I found a damaged handwritten mark. The first initial could be T, H, J, or I. Test those possibilities against the 1,058.",ok:"Correct. 162 records remain. Let's keep going."},
{n:3,answer:"52",prompt:"There's gravy residue associated with the relevant evidence. The kitchen record identifies it as chicken service. Test Chicken against the 162.",ok:"Correct. 52 records remain. Let's keep going."},
{n:4,answer:"22",prompt:"A pink guest badge was recovered. Pink was used for the bride's side. Apply that to the 52.",ok:"Correct. 22 records remain. Let's keep going."},
{n:5,answer:"11",prompt:"The final seating revision was made after the RSVP deadline and incorporated the late-confirmation list. Keep the records that did not RSVP on time. Apply that to the 22.",ok:"Correct. 11 records remain. Let's keep going."},
{n:6,answer:"2",prompt:"The unidentified gift was in the middle value bracket: $50–150. Apply that to the 11.",ok:"Correct. 2 records remain. Let's keep going."},
{n:7,answer:"49",prompt:"The torn seating marker retains the table number: 49. Use that final filter on the two remaining records. Give me the table number.",ok:"Seven leads. One name. The ledger points to Iris Smith — Table 49, Seat 8. Don't accuse her yet. The ledger identifies the person. Now we need to find out what that name means."}
];
const initial={tab:"theo",lead:0,iris:false,messages:[],legalDocs:[],facts:{},task:null,final:false};
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function add(who,text){S.messages.push({who,text});save()}
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9$ ]/g," ").replace(/\s+/g," ").trim()}
function has(s,arr){return arr.some(x=>s.includes(x))}
function currentLead(){return LEADS[S.lead]}
function setTask(text){S.task=text;save()}
function opening(){if(S.messages.length)return;add("theo","I'm Detective Theo Marsh. I have parts of the investigation file. What I don't have is the complete wedding ledger. You do.\n\nI'll give you one lead at a time. Test each lead against the ledger and give me the count.");add("theo",LEADS[0].prompt)}
function render(){opening();const app=document.getElementById("app");app.innerHTML='<div class="nav"><button class="tab '+(S.tab==="theo"?"active":"")+'" onclick="tab(\'theo\')">THEO MARSH</button><button class="tab '+(S.tab==="legal"?"active":"")+'" '+(!S.iris?"disabled":"")+' onclick="tab(\'legal\')">LEGAL TEAM '+(S.iris?"🔓":"🔒")+'</button><button class="tab '+(S.tab==="status"?"active":"")+'" onclick="tab(\'status\')">CASE STATUS</button></div>'+(S.tab==="theo"?theoView():S.tab==="legal"?legalView():statusView())+'<div class="small" style="margin-top:12px">Progress is saved in this browser. Resetting starts a new case on this device.</div>'}
function theoView(){let chat=S.messages.map(m=>'<div class="msg '+m.who+'"><div class="bubble"><div class="speaker">'+(m.who==="theo"?"Theo Marsh":"You")+'</div>'+esc(m.text)+'</div></div>').join("");let task=S.task?'<div class="task"><strong>Current investigation</strong>'+esc(S.task)+'</div>':"";return '<div class="panel"><div class="chat" id="chat">'+chat+'</div>'+task+'<div class="composer"><input id="input" placeholder="'+(S.final?"Case closed.":"Ask Theo anything about the case…")+'" '+(S.final?"disabled":"")+' onkeydown="if(event.key===\'Enter\')send()"><button class="btn primary" onclick="send()" '+(S.final?"disabled":"")+'>Send</button></div></div>'}
function legalView(){if(!S.iris)return '<div class="panel locked">The Legal Team channel is locked. Identify the person the ledger points to first.</div>';let docs=S.legalDocs.length?S.legalDocs.map(d=>'<div class="panel doc"><h3>'+esc(d.title)+'</h3>'+d.body+'</div>').join(""):"";return '<div class="panel"><div class="speaker">Jasmine\'s Legal Team</div><p>We've received Detective Marsh\'s request. Ask us for information about Iris Smith.</p><div class="composer"><input id="legalInput" placeholder="Ask for Iris\'s background, professional history, or Alder Hollow connection…" onkeydown="if(event.key===\'Enter\')legalSend()"><button class="btn primary" onclick="legalSend()">Send</button></div></div>'+docs}
function statusView(){const f=S.facts;return '<div class="panel"><h2>CASE 0147</h2><div class="statusrow"><div class="statusbox"><b>Ledger</b><span>'+(S.iris?"✓ Iris identified":"Lead "+S.lead+" of 7")+'</span></div><div class="statusbox"><b>Iris</b><span>'+(f.conflict?"✓ Professional conflict":"○ Investigation")+'</span></div><div class="statusbox"><b>Timeline</b><span>'+(f.timeline?"✓ Reconstructed":"○ Not established")+'</span></div><div class="statusbox"><b>Cellar</b><span>'+(f.cellar?"✓ Event reconstructed":"○ Not established")+'</span></div><div class="statusbox"><b>Jasmine</b><span>'+(f.jasmine?"✓ Original accusation explained":"○ Not resolved")+'</span></div><div class="statusbox"><b>Final</b><span>'+(S.final?"✓ Case closed":"🔒")+'</span></div></div><div style="margin-top:18px"><button class="btn" onclick="resetCase()">Reset case</button></div></div>'}
function tab(t){S.tab=t;save();render()}
function send(){const el=document.getElementById("input");if(!el||!el.value.trim())return;const q=el.value.trim();add("player",q);processTheo(q);render();setTimeout(()=>{const c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight},20)}
function processTheo(q){const n=normalize(q);if(!S.iris){processLeads(n);return}processInvestigation(n,q)}
function processLeads(n){const L=currentLead();if(!L)return;if(n===L.answer||n===("0"+L.answer)||(L.n===7&&has(n,["49"]))){S.lead++;if(L.n<7){add("theo",L.ok);add("theo",LEADS[S.lead].prompt)}else{S.iris=true;S.facts.identified=true;add("theo",L.ok);add("theo","The ledger tells us who to investigate. It doesn't tell us why she might have gone after Margery.\n\nJasmine's legal team has information that isn't in my police file. I've asked them to open their case material to you.\n\nStart there. Find out who Iris was, how she worked with Margery, and what changed between them.");setTask("Use the Legal Team to investigate Iris before deciding what the ledger result means.")}save()}else{add("theo","Check the current lead against the ledger again. I need the count, not a guess.");}}
function processInvestigation(n,q){
 if(has(n,["what did legal","what did they find","legal team","what does the legal team say"])){add("theo","Bring me the substance of what they found. Tell me in your own words what you learned about Iris and Margery.");return}
 if(has(n,["who is iris","iris background","what was iris doing","iris job","iris profession","iris wedding"])){S.facts.irisBackground=true;add("theo","Iris worked in event design and logistics. She was professionally involved in the Alder Hollow wedding and had worked with Margery on previous events. She wasn't just another wedding guest.");setTask("Now establish Iris's professional relationship with Margery.");return}
 if(has(n,["relationship","know margery","worked with margery","iris and margery"])){S.facts.relationship=true;add("theo","Iris had a professional relationship with Margery. Margery repeatedly relied on Iris when event-design or production problems needed solving, while Iris had complained about being excluded from meetings and client-facing interactions.");setTask("Find out what made that professional relationship deteriorate.");return}
 if(has(n,["motive","why would iris","why was iris angry","problem with margery","conflict","credit","take credit","exploited"])){if(!S.facts.irisBackground&&!S.facts.relationship){add("theo","Motive needs evidence. Start with who Iris was and how she worked with Margery. The Legal Team can help with that.");setTask("Investigate Iris's professional relationship with Margery.");return}S.facts.conflict=true;add("theo","The legal material shows a repeated professional conflict: Margery relied on Iris's work, Iris was excluded from important meetings and client interactions, and work Iris contributed was presented without proper credit. Margery dismissed her complaints and could influence future recommendations.\n\nThat's a credible professional grievance. But motive isn't the same thing as murder.");setTask("Establish opportunity. Reconstruct where everyone was around 8:05 and afterward.");return}
 if(has(n,["timeline","8:05","after 8","where was jasmine","where was margery","opportunity"])){if(!S.facts.conflict){add("theo","We can reconstruct the timeline, but establish the Iris–Margery conflict first. Otherwise we're mixing opportunity with motive.");return}S.facts.timeline=true;S.facts.opportunity=true;add("theo","Here's what the evidence gives us in pieces:\n\nJasmine and Margery argued around 8:05 PM. Jasmine returned to the reception. Margery later went toward the cellar. There is no evidence placing Jasmine in the cellar.\n\nThe remaining question is who else needs to be accounted for.\n\nYou already have the name: Iris.");setTask("Reconstruct the sequence: Jasmine's argument → Jasmine returns → Margery goes to the cellar → Iris must be accounted for.");return}
 if(has(n,["cellar","confrontation","grabbed","grab","push","shove","fell","stairs","alive","call for help","help"])){if(!S.facts.timeline){add("theo","We aren't ready to reconstruct the cellar yet. First establish the timeline: the 8:05 argument, Jasmine returning to the reception, and Margery going toward the cellar.");return}if(has(n,["alive","still alive","dead immediately"])){S.facts.alive=true;add("theo","No. Margery was still alive after the fall.");}else if(has(n,["help","call"])){S.facts.noHelp=true;add("theo","Iris could have called for help. She didn't. She left the cellar without calling for assistance.");}else if(has(n,["push","shove"])){S.facts.push=true;add("theo","Yes. Margery grabbed Iris during the confrontation. Iris shoved her, and Margery fell down the cellar stairs.");}else if(has(n,["grab"])){add("theo","Margery grabbed Iris during the confrontation.");}else{add("theo","They confronted each other in the cellar. The evidence points to their unresolved professional conflict as the reason. Ask me what happened next.");}if(S.facts.push&&S.facts.alive&&S.facts.noHelp)S.facts.cellar=true;return}
 if(has(n,["why did she lie","why jasmine lie","jasmine lie","protect her marriage","secret marriage","blackmail"])){S.facts.jasmine=true;add("theo","Jasmine lied to protect her secret marriage. Margery had discovered the marriage certificate and used it to demand money: $5,000 was paid, then Margery demanded another $15,000. Jasmine refused, and Margery threatened to tell Ethan's family. They argued around 8:05 PM. But none of that puts Jasmine in the cellar.");return}
 if(has(n,["did jasmine follow","jasmine cellar","jasmine went downstairs","jasmine go downstairs"])){S.facts.jasmine=true;add("theo","No evidence places Jasmine in the cellar. Jasmine returned to the reception after the 8:05 argument. She did not follow Margery downstairs.");setTask("Now account for the person who could have reached the cellar.");return}
 if(has(n,["i don't believe iris","dont believe iris","not iris","iris innocent"])){add("theo","That's a theory worth testing. Don't believe me just because the ledger identified her. Tell me what doesn't fit. We have to separate motive, opportunity, and what actually happened in the cellar.");return}
 if(has(n,["who killed","killer","is iris the killer","did iris kill"])){add("theo","The ledger points to Iris Smith, but don't skip the investigation. A name isn't a murder case. We still need the motive, timeline, cellar event, aftermath, and the reason Jasmine was blamed.");return}
 if(has(n,["jasmine","arrested","why jasmine"])){S.facts.jasmine=true;add("theo","Jasmine was arrested because the police had a strong apparent case: a secret marriage, Margery's blackmail demands, the 8:05 argument, and Jasmine's later lie about what the argument was really about. But the investigation did not establish that Jasmine followed Margery to the cellar.");return}
 if(has(n,["final report","final","who was responsible","what happened and why was jasmine blamed"])){add("theo","Give me the complete reconstruction: who was responsible, what happened in the cellar, what happened after the fall, and why Jasmine was blamed.");return}
 add("theo","I can work with that question, but I need to keep the evidence in order. Ask me about Iris, Margery, Jasmine, the timeline, the cellar, or what the evidence does — and I'll tell you what the file establishes so far.");
}
function legalSend(){const el=document.getElementById("legalInput");if(!el||!el.value.trim())return;const q=normalize(el.value);
 if(has(q,["relationship","conflict","margery","professional","credit"])){if(!S.legalDocs.some(d=>d.title.includes("RELATIONSHIP"))){S.legalDocs.push({title:"PRIVATE CASE RESEARCH — IRIS SMITH / MARGERY VOSS",body:"<p>The records show a repeated pattern.</p><ul><li>Margery relied on Iris when problems needed solving.</li><li>Iris's contributions were not consistently credited.</li><li>Iris was increasingly excluded from client-facing work.</li><li>Margery continued contacting Iris when something went wrong.</li><li>Iris objected to the arrangement.</li><li>Margery dismissed the complaints.</li><li>Margery's recommendations could affect Iris's future opportunities.</li></ul><p>The relationship appears to have deteriorated significantly before the Alder Hollow wedding.</p>"})}}
 else if(has(q,["alder","wedding","connection"])){if(!S.legalDocs.some(d=>d.title.includes("ALDER HOLLOW"))){S.legalDocs.push({title:"PRIVATE CASE NOTE — ALDER HOLLOW / IRIS",body:"<p>Iris was involved in the Alder Hollow wedding preparation.</p><p>Margery continued to rely on Iris's work while their professional dispute remained unresolved.</p><p>The relationship deteriorated further during the final preparations.</p>"})}}
 else {if(!S.legalDocs.some(d=>d.title.includes("IRIS SMITH"))){S.legalDocs.push({title:"PRIVATE CASE RESEARCH — IRIS SMITH",body:"<p><b>Professional field:</b> Event design and logistics.</p><p><b>Alder Hollow:</b> Iris was professionally involved in the wedding preparation.</p><p><b>Connection to Margery Voss:</b> Iris had worked with Margery on previous events. Margery repeatedly relied on Iris when production or design problems needed solving.</p><p><b>Professional complaints:</b></p><ul><li>Excluded from meetings.</li><li>Excluded from client-facing interactions.</li><li>Work she contributed was presented without proper credit.</li><li>Often contacted when something needed fixing.</li></ul><p>Margery dismissed Iris's complaints as essentially “how the industry works.” Margery also had influence over recommendations and future opportunities available to Iris.</p>"})}}
 save();render()}
function resetCase(){if(confirm("Reset this case? All progress and conversation on this device will be erased.")){localStorage.removeItem(KEY);S=structuredClone(initial);render()}}
render();
</script></body></html>
