*{box-sizing:border-box}:root{--bg:#0d0c0b;--panel:#171513;--panel2:#1e1a18;--text:#f1ece5;--muted:#aaa198;--line:#39312c;--accent:#9f4643;--gold:#c9a86b;--green:#8ea77c}body{margin:0;background:radial-gradient(circle at 50% -10%,#241c19 0,#0d0c0b 45%);color:var(--text);font:15px/1.6 Georgia,serif}.wrap{max-width:1060px;margin:auto;padding:22px 18px 60px}header{border-bottom:1px solid var(--line);padding:8px 0 18px;margin-bottom:14px}.kicker{font:10px Arial,sans-serif;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}.title{font-size:34px;letter-spacing:.16em;margin:4px 0}.sub{color:var(--muted);font-size:13px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab,.btn{border:1px solid var(--line);background:rgba(23,21,19,.9);color:var(--text);padding:10px 14px;border-radius:7px;cursor:pointer}.tab.active,.btn.primary{background:var(--accent);border-color:var(--accent)}.tab:disabled{opacity:.38;cursor:not-allowed}.panel{background:rgba(23,21,19,.94);border:1px solid var(--line);border-radius:10px;padding:18px;margin:10px 0}.chat{height:54vh;min-height:420px;overflow:auto;padding:8px 4px}.msg{margin:15px 0;display:flex}.msg.theo{justify-content:flex-start}.msg.player{justify-content:flex-end}.bubble{max-width:78%;padding:13px 16px;border-radius:10px;white-space:pre-wrap}.theo .bubble{background:var(--panel2);border:1px solid var(--line)}.player .bubble{background:#382525;border:1px solid #65403e}.speaker{font:10px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}.player .speaker{color:#d5aaa5}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1;background:#0b0a09;border:1px solid var(--line);color:var(--text);padding:13px;border-radius:7px;font:15px Georgia,serif}.composer button{min-width:100px}.task{border-left:3px solid var(--gold);padding:11px 14px;background:#141210;margin:14px 0;color:#ddd4c9}.task strong{display:block;color:var(--gold);font:10px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;margin-bottom:3px}.statusrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.statusbox{background:var(--panel2);border:1px solid var(--line);padding:12px;border-radius:7px}.statusbox b{display:block;color:var(--gold);font:10px Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}.statusbox span{color:var(--muted)}.small{font:11px Arial,sans-serif;color:var(--muted)}.locked{color:var(--muted);font-style:italic}.doc{background:#eee7da;color:#211c18;padding:20px;border-radius:7px}.doc h3{margin-top:0;color:#211c18}.journey{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}.step{font:9px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border:1px solid var(--line);border-radius:5px;color:#80776f}.step.on{color:var(--gold);border-color:#705b40;background:#211c16}.step.done{color:var(--green);border-color:#48543e}.hint{font-size:13px;color:var(--muted);margin:0 0 10px}.legal-intro{color:#bdb4aa}.doc ul{padding-left:20px}@media(max-width:650px){.bubble{max-width:92%}.statusrow{grid-template-columns:1fr}.composer{flex-direction:column}.composer button{width:100%}.chat{height:55vh;min-height:380px}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Georgia,serif}.wrap{max-width:980px;margin:auto;padding:24px 18px 60px}header{border-bottom:1px solid var(--line);padding:10px 0 20px;margin-bottom:18px}.kicker{font:11px Arial,sans-serif;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}.title{font-size:32px;letter-spacing:.12em;margin:5px 0}.sub{color:var(--muted)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer}.tab.active,.btn.primary{background:var(--accent);border-color:var(--accent)}.tab:disabled{opacity:.4;cursor:not-allowed}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}.chat{max-height:58vh;overflow:auto;padding:4px}.msg{margin:12px 0;display:flex}.msg.theo{justify-content:flex-start}.msg.player{justify-content:flex-end}.bubble{max-width:82%;padding:12px 15px;border-radius:12px;white-space:pre-wrap}.theo .bubble{background:var(--panel2);border:1px solid var(--line)}.player .bubble{background:#382525;border:1px solid #65403e}.speaker{font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}.composer{display:flex;gap:8px;margin-top:12px}.composer input{flex:1;background:#0e0d0c;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:8px;font:15px Georgia,serif}.composer button{min-width:100px}.task{border-left:3px solid var(--gold);padding:10px 14px;background:#171513;margin:14px 0}.task strong{display:block;color:var(--gold);font:11px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase}.statusrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statusbox{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:8px}.statusbox b{display:block;color:var(--gold);font:11px Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}.statusbox span{color:var(--muted)}.small{font:12px Arial,sans-serif;color:var(--muted)}.locked{color:var(--muted);font-style:italic}.doc{background:#eee7da;color:#211c18;padding:20px;border-radius:8px}.doc h3{margin-top:0}@media(max-width:650px){.bubble{max-width:92%}.statusrow{grid-template-columns:1fr}.composer{flex-direction:column}.composer button{width:100%}}

.auth-shell{min-height:82vh;display:flex;align-items:center;justify-content:center;padding:30px 0}.auth-card{width:min(520px,100%);background:rgba(23,21,19,.96);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 18px 60px rgba(0,0,0,.35)}.auth-brand{text-align:center;margin-bottom:22px}.auth-brand .title{font-size:28px}.auth-title{font-size:23px;margin:4px 0 8px}.auth-copy{color:var(--muted);font-size:13px;margin:0 0 18px}.auth-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}.auth-tab{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 8px;border-radius:7px;cursor:pointer;font:11px Arial,sans-serif;letter-spacing:.05em}.auth-tab.active{background:var(--accent);border-color:var(--accent)}.auth-form label{display:block;font:10px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:13px 0 6px}.auth-form input{width:100%;background:#0b0a09;border:1px solid var(--line);color:var(--text);padding:12px;border-radius:7px;font:15px Georgia,serif}.auth-actions{margin-top:18px}.auth-actions button{width:100%}.auth-error{display:none;background:#3b2422;border:1px solid #6b3d38;color:#e9c8c2;padding:10px 12px;border-radius:7px;margin:12px 0;font-size:13px}.auth-note{font:11px Arial,sans-serif;color:var(--muted);margin-top:16px;text-align:center}.account-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-4px 0 12px;font:11px Arial,sans-serif;color:var(--muted)}.account-bar button{padding:6px 9px}.code-box{letter-spacing:.2em;text-transform:uppercase;text-align:center}.auth-divider{text-align:center;margin:18px 0;color:var(--muted);font:12px Arial,sans-serif;letter-spacing:.12em}.login-option{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:4px}.login-option h3{margin:0 0 10px;font-size:17px}.small-copy{font:12px Arial,sans-serif;color:var(--muted);margin:0 0 12px}.auth-success{text-align:center;color:var(--gold);font:11px Arial,sans-serif;letter-spacing:.16em;margin-bottom:12px}.case-code-display{background:#0b0a09;border:1px solid var(--gold);border-radius:8px;padding:18px 12px;text-align:center;color:var(--gold);font:700 24px/1.2 Arial,sans-serif;letter-spacing:.16em;margin:20px 0}.auth-actions{margin-top:16px}</style>

<body><div class="wrap"><header><div class="kicker">Private Investigation Channel</div><div class="title">UNINVITED</div><div class="sub">CASE 0147 · Detective Theo Marsh</div></header><div id="app"></div></div>
<script>
const KEY="UNINVITED_V7_CONVERSATION";
const AUTH_KEY="UNINVITED_AUTH_V2";
const API_BASE="https://YOUR-UNINVITED-BACKEND.vercel.app";
const LEADS=[
 {n:1,answer:"1058",prompt:"I went back through the CCTV report.\n\nMost of the reception was covered, but there was a gap in the camera coverage. The report places the blind spot around Tables 46 through 50.\n\nThat's important, but it doesn't tell us who was there.\n\nCheck that section of the wedding ledger for me.",ok:"1,058."},
 {n:2,answer:"162",prompt:"That's still too many people.\n\nI went back to the physical evidence.\n\nThere's a handwritten mark on one of the items recovered during the investigation. It's damaged, but I can make out what might be a first initial.\n\nT, H, J, or I.\n\nI'm not confident enough to say which one it is.\n\nSee what that does to the group.",ok:"162."},
 {n:3,answer:"52",prompt:"I also had the lab re-check something recovered from the reception.\n\nThey identified chicken gravy.\n\nIt may give us another way to narrow the same group.\n\nCheck the meal field.",ok:"52."},
 {n:4,answer:"22",prompt:"Now we're starting to see a pattern.\n\nI found another detail in the evidence file.\n\nOne of the guest badges recovered from the relevant area was pink. The reception records distinguish between the bride's side and the groom's side.\n\nCheck which of the remaining records belong to the bride's side.",ok:"22."},
 {n:5,answer:"11",prompt:"That's a much smaller group.\n\nI went back through the final seating records because there's something unusual about the last revision.\n\nThe seating plan was updated after the RSVP deadline. The revision included people from the late-confirmation list.\n\nCheck the remaining records against the late-confirmation initials: E or L.",ok:"11."},
 {n:6,answer:"2",prompt:"Eleven.\n\nI found another piece of the evidence that may help.\n\nAn unidentified wedding gift was recorded in the inventory. We never established who sent it, but the inventory gives us an approximate value.\n\nIt falls somewhere between $50 and $150.\n\nCheck that value range against the eleven remaining records.",ok:"2."},
 {n:7,answer:"49",prompt:"Only two people still fit everything we've found.\n\nI went back to the evidence recovered from the reception.\n\nThere's a torn seating marker. Most of it is missing, but one detail is still readable:\n\nTable 49.\n\nI don't have the seat number.\n\nCheck the two remaining records against Table 49. Who's left?",ok:"Seven pieces of evidence. One person left."}
];
const initial={tab:"theo",lead:0,iris:false,messages:[],docs:[],facts:{},task:"",final:false};
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){return structuredClone(initial)}}
function save(){
 localStorage.setItem(KEY,JSON.stringify(S));
 var auth=getAuth();
 if(auth&&auth.token){clearTimeout(window.__saveTimer);window.__saveTimer=setTimeout(function(){api("/api/progress",{method:"PUT",body:JSON.stringify({progress:S})}).catch(function(){});},250);}
}
function esc(x){return String(x).replace(/[&<>\"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function add(w,t){S.messages.push({w:w,t:t});save()}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9$ ]/g," ").replace(/\s+/g," ").trim()}
function has(s,a){return a.some(function(x){return s.indexOf(x)>=0})}
function fact(k){return !!S.facts[k]}
function task(t){S.task=t;save()}
function opening(){
 if(S.messages.length)return;
 add("theo","I'm Detective Theo Marsh. I have parts of the investigation file. What I don't have is the complete wedding ledger. You do.\n\nI've been going back through the evidence the original investigation used against Jasmine.\n\nThere's something bothering me about it.\n\nThe case against her is built around what she did before Margery died.\n\nI'm interested in what happened after Margery left the reception.\n\nLet's start with the evidence I can recover.");
 add("theo",LEADS[0].prompt);
}
function getAuth(){try{return JSON.parse(localStorage.getItem(AUTH_KEY))||null}catch(e){return null}}
function setAuth(a){localStorage.setItem(AUTH_KEY,JSON.stringify(a))}
function api(path,options){
 options=options||{}; options.headers=Object.assign({"Content-Type":"application/json"},options.headers||{});
 var auth=getAuth(); if(auth&&auth.token) options.headers.Authorization="Bearer "+auth.token;
 return fetch(API_BASE+path,options).then(async function(r){var d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||"Connection error.");return d;});
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));var auth=getAuth();if(auth&&auth.token){clearTimeout(window.__saveTimer);window.__saveTimer=setTimeout(function(){api("/api/progress",{method:"PUT",body:JSON.stringify({progress:S})}).catch(function(){});},250);}}
async function signInEmail(){var email=(document.getElementById("authEmail")||{}).value||"",password=(document.getElementById("authPassword")||{}).value||"";if(!email||!email.includes("@")||!password){authMessage("Enter your email and password.");return}try{var d=await api("/api/auth",{method:"POST",body:JSON.stringify({action:"login",email,password})});setAuth({token:d.token,player:d.player});S=d.progress||structuredClone(initial);localStorage.setItem(KEY,JSON.stringify(S));render();}catch(e){authMessage(e.message)}}
async function signInCode(){var code=((document.getElementById("authCaseCode")||{}).value||"").trim().toUpperCase();if(!code){authMessage("Enter your case code.");return}try{var d=await api("/api/auth",{method:"POST",body:JSON.stringify({action:"codeLogin",caseCode:code})});setAuth({token:d.token,player:d.player});S=d.progress||structuredClone(initial);localStorage.setItem(KEY,JSON.stringify(S));render();}catch(e){authMessage(e.message)}}
async function createAccount(){var name=(document.getElementById("authName")||{}).value||"",email=(document.getElementById("authEmail")||{}).value||"",password=(document.getElementById("authPassword")||{}).value||"";if(!name||!email.includes("@")||password.length<8){authMessage("Enter your name, a valid email, and a password of at least 8 characters.");return}try{var d=await api("/api/auth",{method:"POST",body:JSON.stringify({action:"create",name,email,password})});setAuth({token:d.token,player:d.player});S=structuredClone(initial);localStorage.setItem(KEY,JSON.stringify(S));render();}catch(e){authMessage(e.message)}}
function logout(){localStorage.removeItem(AUTH_KEY);localStorage.removeItem(KEY);S=structuredClone(initial);render()}
function authTab(t){window.AUTH_TAB=t;renderAuth()}
function authMessage(msg){var e=document.getElementById("authError");if(e){e.textContent=msg;e.style.display="block"}}
function showAssignedCode(player){
 var code=player&&player.caseCode?player.caseCode:"";
 document.getElementById("app").innerHTML='<div class="auth-shell"><div class="auth-card"><div class="auth-success">ACCOUNT CREATED</div><h2 class="auth-title">Your case has been assigned</h2><p class="auth-copy">Your UNINVITED investigation has been created. This unique case code belongs to you.</p><div class="case-code-display">'+esc(code)+'</div><p class="auth-copy"><strong>Save this code.</strong> You can use it to return to your investigation whenever you come back.</p><div class="auth-actions"><button class="btn primary" onclick="S=structuredClone(initial);render()">ENTER CASE ROOM</button></div></div></div>';
}
function renderAuth(){
 var t=window.AUTH_TAB||"signin";
 var body=t==="signin"
 ? '<h2 class="auth-title">Return to your case</h2><p class="auth-copy">Choose how you want to return to your investigation.</p><div class="auth-form"><div class="login-option"><h3>Email & Password</h3><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"><label>Password</label><input id="authPassword" type="password" placeholder="Password"><div class="auth-actions"><button class="btn primary" onclick="signInEmail()">SIGN IN</button></div></div><div class="auth-divider">OR</div><div class="login-option"><h3>Case Code</h3><p class="small-copy">Use the unique code assigned to your investigation.</p><label>Case code</label><input id="authCaseCode" class="code-box" placeholder="UNV-XXXXXX-XXXX"><div class="auth-actions"><button class="btn" onclick="signInCode()">RETURN WITH CASE CODE</button></div></div></div>'
 : '<h2 class="auth-title">Create your detective account</h2><p class="auth-copy">Create your account with your email and password. Your unique case code will be assigned automatically after registration.</p><div class="auth-form"><label>Name</label><input id="authName" placeholder="Your name"><label>Email</label><input id="authEmail" type="email" placeholder="you@example.com"><label>Password</label><input id="authPassword" type="password" placeholder="At least 8 characters"><div class="auth-actions"><button class="btn primary" onclick="createAccount()">CREATE ACCOUNT</button></div></div>';
 document.getElementById("app").innerHTML='<div class="auth-shell"><div class="auth-card"><div class="auth-tabs"><button class="'+(t==="signin"?"active":"")+'" onclick="authTab(\'signin\')">SIGN IN</button><button class="'+(t==="create"?"active":"")+'" onclick="authTab(\'create\')">CREATE ACCOUNT</button></div>'+body+'<div id="authError" class="auth-error"></div><div class="auth-note">Your case code is assigned automatically when you create an account. Keep it safe — it can be used to return to your case.</div></div></div>';
}
function render(){
 if(!getAuth()){renderAuth();return}
 opening();
 var auth=getAuth();
 var account='<div class="account-bar">Case '+esc(auth.player.caseCode)+' · Signed in as '+esc(auth.player.name)+' <button class="btn" onclick="logout()">SIGN OUT</button></div>';
 var nav=account+'<div class="nav"><button class="tab '+(S.tab==="theo"?"active":"")+'" onclick="tab(\'theo\')">THEO MARSH</button><button class="tab '+(S.tab==="legal"?"active":"")+'" '+(!S.iris?"disabled":"")+' onclick="tab(\'legal\')">LEGAL TEAM '+(S.iris?"🔓":"🔒")+'</button><button class="tab '+(S.tab==="status"?"active":"")+'" onclick="tab(\'status\')">CASE STATUS</button><button class="tab" onclick="resetCase()">START OVER</button></div>';
 document.getElementById("app").innerHTML=nav+journeyBar()+(S.tab==="theo"?theo():S.tab==="legal"?legal():status())+'<div class="small" style="margin-top:12px">Private case channel · V7 investigation journey · your progress is saved in this browser.</div>';
}
function journeyBar(){
 var steps=[
  ["LEDGER",S.iris],
  ["IRIS",S.facts.irisBackground&&S.facts.relationship&&S.facts.conflict],
  ["TIMELINE",S.facts.timeline],
  ["INTERVIEW",S.facts.irisInterview],
  ["TRUTH",S.final]
 ];
 return '<div class="journey">'+steps.map(function(x,i){return '<div class="step '+(x[1]?"done":(i===0&&!S.iris||i===1&&S.iris&&!x[1]?"on":""))+'">'+(x[1]?"✓ ":"")+x[0]+'</div>'}).join("")+'</div>';
}
function theo(){
 var chat=S.messages.map(function(m){return '<div class="msg '+m.w+'"><div class="bubble"><div class="speaker">'+(m.w==="theo"?"Theo Marsh":"You")+'</div>'+esc(m.t)+'</div></div>'}).join("");
 var t=S.task?'<div class="task"><strong>Next move</strong>'+esc(S.task)+'</div>':"";
 return '<div class="panel"><div class="chat" id="chat">'+chat+'</div>'+t+'<div class="composer"><input id="input" placeholder="'+(S.final?"Case closed.":"Ask Theo anything about the case…")+'" '+(S.final?"disabled":"")+' onkeydown="if(event.key===\'Enter\')send()"><button class="btn primary" onclick="send()" '+(S.final?"disabled":"")+'>Send</button></div></div>';
}
function legal(){
 var docs=S.docs.map(function(d){return '<div class="panel doc"><h3>'+esc(d.title)+'</h3>'+d.body+'</div>'}).join("");
 return '<div class="panel"><div class="speaker">Jasmine\'s Legal Team</div><p>You have access to documents the police file does not contain. Read them as an investigator, then return to Theo and explain what they establish in your own words.</p><div class="composer"><input id="legalInput" placeholder="Ask for a case document or interview…" onkeydown="if(event.key===\'Enter\')legalSend()"><button class="btn primary" onclick="legalSend()">Request</button></div></div>'+docs;
}
function status(){
 var f=S.facts;
 return '<div class="panel"><div class="speaker">Investigation board</div><h2>CASE 0147</h2><p class="hint">This board shows broad investigative progress. It does not reveal the answers for you.</p><div class="statusrow">'+
 '<div class="statusbox"><b>Ledger</b><span>'+(S.iris?"✓ Iris identified":"Lead "+S.lead+" of 7")+'</span></div>'+
 '<div class="statusbox"><b>Iris</b><span>'+(fact("irisBackground")&&fact("relationship")&&fact("conflict")?"✓ Established":"○ Investigation")+'</span></div>'+
 '<div class="statusbox"><b>Timeline</b><span>'+(fact("timeline")?"✓ Reconstructed":"○ Not established")+'</span></div>'+
 '<div class="statusbox"><b>Interview</b><span>'+(fact("irisInterview")?"✓ Completed":"○ Not completed")+'</span></div>'+
 '<div class="statusbox"><b>Truth</b><span>'+(S.final?"✓ Established":"○ Unresolved")+'</span></div>'+
 '</div><div style="margin-top:18px"><button class="btn" onclick="resetCase()">Reset case</button></div></div>';
}
function tab(t){S.tab=t;save();render()}
function send(){var el=document.getElementById("input");if(!el||!el.value.trim())return;var q=el.value.trim();add("player",q);route(q);render();var c=document.getElementById("chat");if(c)c.scrollTop=c.scrollHeight}
function legalSend(){var el=document.getElementById("legalInput");if(!el||!el.value.trim())return;var q=norm(el.value);addLegal(q);render()}
function addLegal(q){
 if(has(q,["interview","question iris","question her","speak to iris","talk to iris","confront iris"])){
  if(!S.docs.some(function(d){return d.id==="interview"}))S.docs.push({id:"interview",title:"IRIS SMITH — INTERVIEW",body:"<p>Iris initially refuses to discuss what happened after she left Table 49.</p><p>When confronted with the seating record and the timeline, she finally admits:</p><p><strong>“I went to find Margery.”</strong></p><p>Iris says she confronted Margery in the cellar about the way Margery had treated her and taken credit for her work.</p><p>They argued. Margery grabbed Iris. Iris pushed her. Margery fell down the cellar stairs.</p><p><strong>Margery was still alive after the fall.</strong></p><p>Iris admits she could have called for help.</p><p><strong>She didn't.</strong></p><p>She left the cellar and returned to the reception without telling anyone what had happened.</p>"}); 
  S.facts.irisInterview=true;
  add("theo","The Legal Team has interviewed Iris. Read her statement carefully.\n\nThen come back and tell me what she admitted.");
  task("Read the Iris interview, then tell Theo what Iris said happened.");
 }else if(has(q,["background","who is iris","what does iris do","job","profession","work"])){
  if(!S.docs.some(function(d){return d.id==="background"}))S.docs.push({id:"background",title:"WHO IS IRIS?",body:"<p>Iris Smith works in event design and logistics. She was professionally involved in the Alder Hollow wedding and had worked with Margery on previous events.</p><p>Margery relied on Iris when event-design or production problems needed solving. Iris was not simply a wedding guest.</p>"});
  add("theo","The Legal Team has released its background material on Iris. Read it, then come back and tell me what you learned.");
 }else if(has(q,["relationship","professional history","history","margery","credit","excluded"])){
  if(!S.docs.some(function(d){return d.id==="relationship"}))S.docs.push({id:"relationship",title:"IRIS / MARGERY PROFESSIONAL HISTORY",body:"<p>The records show a repeated pattern.</p><ul><li>Margery relied on Iris when problems needed fixing.</li><li>Iris was excluded from meetings and client-facing interactions.</li><li>Iris's work was presented without proper credit.</li><li>Margery continued contacting Iris when something went wrong.</li><li>Iris complained about the arrangement.</li><li>Margery dismissed the complaints as “how the industry works.”</li><li>Margery could affect future recommendations and opportunities.</li></ul>"});
  add("theo","The Legal Team has released the professional-history material. Bring the substance back to me in your own words.");
 }else if(has(q,["alder","wedding","connection"])){
